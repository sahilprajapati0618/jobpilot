# One-click deploy on Render (https://render.com): New > Blueprint > pick this repo.
services:
  - type: web
    name: jobpilot
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start:web
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: PUBLIC_URL
        sync: false # set to your Render URL, e.g. https://jobpilot.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
